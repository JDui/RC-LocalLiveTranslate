name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native build tools
        run: sdkmanager 'ndk;29.0.14206865' 'cmake;3.22.1'
      - run: chmod +x gradlew
      - name: Prepare pinned offline native SDKs
        shell: pwsh
        run: ./scripts/bootstrap-native.ps1
      - run: ./gradlew assembleRelease assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest :app:assembleBenchmark :app:lintBenchmark :macrobenchmark:assembleBenchmark --console=plain --max-workers=2
      - name: Check native alignment
        shell: pwsh
        run: ./scripts/verify-native.ps1
      - name: Check isolated benchmark packages and alignment
        shell: pwsh
        run: |
          ./scripts/test-elf-alignment.ps1
          ./scripts/verify-benchmark.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/ui-screenshots/
            app/build/outputs/apk/benchmark/*.apk
            macrobenchmark/build/outputs/apk/benchmark/*.apk
